name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install cross-compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf file

    - name: Build ARM32
      run: |
        arm-linux-gnueabihf-gcc -O0 -Wall -o exp exp.c -lutil

    - name: Verify
      run: |
        echo "=== File info ==="
        file exp

        echo "=== ELF info ==="
        readelf -h exp || true

        echo "=== Binary size ==="
        ls -lh exp

    - name: Upload build directory as artifact
      uses: actions/upload-artifact@v6
      with:
        name: output
        path: |
          exp
        retention-days: 7
        if-no-files-found: error
        compression-level: 6
        overwrite: true
